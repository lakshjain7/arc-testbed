# OpenTelemetry Collector: receives traces from instrumented services,
# derives a per-edge service graph (servicegraph connector) and per-service
# request metrics (spanmetrics connector), and exposes both to the Prometheus
# that already exists in kube-system - no new Prometheus needed.
#
# store.ttl and store.max_items are raised from the connector's defaults
# (2s / 1000) per the earlier research finding: Train Ticket's call chains
# are deep and slow enough that the defaults silently drop edges.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: train-ticket
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    # metrics_flush_interval: the connectors' defaults pushed new counts only every 60 s
    # (spanmetrics) and 15 s (servicegraph), measured 2026-09-29. A 30 s B1 window could
    # then fall between two updates. 5 s matches the Prometheus scrape interval for this job.
    # Buckets reach 30 s: with a 5 s top bucket, anything slower was capped at 5000 ms, which
    # hides exactly the slow-down damage the dataset has to measure.
    connectors:
      servicegraph:
        latency_histogram_buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 750ms, 1s, 2s, 5s, 10s, 15s, 30s]
        dimensions: []
        metrics_flush_interval: 5s
        store:
          ttl: 30s
          max_items: 100000
        cache_loop: 2m
        store_expiration_loop: 10s
      spanmetrics:
        metrics_flush_interval: 5s
        histogram:
          explicit:
            buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 750ms, 1s, 2s, 5s, 10s, 15s, 30s]
        dimensions: []

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        enable_open_metrics: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [servicegraph, spanmetrics]
        metrics/servicegraph:
          receivers: [servicegraph]
          exporters: [prometheus]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: train-ticket
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # picked up by Prometheus's existing kubernetes-pods job (annotation-based discovery)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/config.yaml"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 400Mi}
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: train-ticket
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8889
      targetPort: 8889
